[project]
name = "samsung-scanner"
version = "0.1.0"
description = "CLI scanner client for Samsung SL-M2070 series MFP (WSD protocol)"
authors = [
    { name = "Jerin Joy", email = "github@jerin.me" }
]
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
]

[project.scripts]
samsung-scanner = "samsung_scanner:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
